# Antigravity OneBot & Milky Bridge Configuration

onebot:
  # Protocol: "auto" (auto-detects OneBot / Milky), "onebot", or "milky"
  protocol: "auto"
  
  # Connection mode: "forward" (bot connects to WS) or "reverse" (protocol endpoint connects here)
  mode: "forward"
  
  # Forward WS endpoint (NapCat / LLOneBot / Lagrange / Milky)
  # For Milky: usually "ws://127.0.0.1:3001/event"
  ws_url: "ws://127.0.0.1:3001"
  event_ws_url: ""
  
  # HTTP API root (e.g. "http://127.0.0.1:3001/api" for Milky, or "http://127.0.0.1:3000" for OneBot)
  api_url: "http://127.0.0.1:3000"
  
  # Reverse WS listening address (used when mode is "reverse")
  reverse_host: "0.0.0.0"
  reverse_port: 8080
  
  # Access token (leave empty if not configured in OneBot / Milky)
  access_token: ""
  
  # Bot QQ number (used to detect @bot mentions in groups)
  bot_qq: "12345678"

antigravity:
  # Driver mode: "auto" (detects SDK/CLI/API), "sdk", "cli", or "api"
  mode: "auto"
  cli_command: "agy"
  model_name: "gemini-3.8-flash-low"
  api_key: ""
  api_base_url: ""
  timeout: 120.0

roleplay:
  # Default persona card name (from roles/<name>.md)
  default_role: "yucca"
  roles_dir: ""
  enable_group_persona: true

trigger:
  # Automatically reply to private messages
  reply_private: true
  
  # In group chats, require @bot mention or prefix
  require_at_in_group: true
  command_prefix: "/"
  
  # Optional group filters (empty list disables filtering)
  group_whitelist: []
  group_blacklist: []

# Maximum characters per message before splitting (QQ safe limit)
max_chunk_length: 4000

# Conversation history memory window
max_history_turns: 15
